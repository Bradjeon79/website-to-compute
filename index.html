<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PB2 예측기 실행</title>
  <style>
    body {
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    button {
      font-size: 20px;
      padding: 14px 30px;
      border: none;
      border-radius: 12px;
      background-color: #3fcf6f;
      color: black;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #32b55c;
    }
  </style>
</head>
<body>
  <h1>PB2 예측기</h1>
  <button onclick="launchPB2()">예측기 실행</button>

  <script>
    function launchPB2() {
      // B: 예측기 UI 열기
      window.open('pb2_predictor_ui.html', 'PB2 예측기', 'width=800,height=900');

      // C: 유저용 크롬창 시뮬레이션 (빈 페이지 or 실주소 넣을 수 있음)
      window.open('https://example-baccarat-site.com', '바카라사이트', 'width=1280,height=720');
    }
  </script>
</body>
</html>
